[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "passguard"
version = "0.1.0"
description = "Comprehensive password validation library with customizable rules, context-aware validation, and Pydantic integration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "PassGuard Contributors" }
]
keywords = ["password", "validation", "security", "pydantic", "rules"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pylint>=4.0.4",
    "twine>=6.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=4.0.0",
    "pylint>=3.0.0",
    "pyright>=1.1.0",
]
pydantic = ["pydantic>=2.0,<3.0"]

[project.urls]
Homepage = "https://github.com/boluwatife-py/passguard"
Documentation = "https://github.com/boluwatife-py/passguard#readme"
Repository = "https://github.com/boluwatife-py/passguard.git"
"Bug Tracker" = "https://github.com/boluwatife-py/passguard/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages]
find = { where = ["src"], include = ["passguard*"] }

[tool.setuptools.package-data]
passguard = ["data/*.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: unit tests",
    "integration: integration tests",
]

[tool.coverage.run]
source = ["src/passguard"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pylint.messages_control]
disable = [
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
    "W0212",  # protected-access
]

[tool.pylint.format]
max-line-length = 100

[tool.pyright]
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
